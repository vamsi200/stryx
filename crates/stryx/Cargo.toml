[package]
name = "stryx"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32c.workspace = true
rand.workspace = true
thiserror.workspace = true
anyhow.workspace = true
zstd = "0.14.3"
lz4 = "1.28.1"
spillsort = "0.2.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
xorf = { version = "0.13.0", features = ["serde"] }
arbitrary = "1.5.0"
