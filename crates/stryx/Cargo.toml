[package]
name = "stryx"
version = "0.1.0"
edition = "2024"
description = "A high-performance, block-based SSTable storage engine for Rust."
readme = "../../README.md"
license = "MIT"
repository = "https://github.com/vamsi200/stryx"
keywords = [
    "sstable",
    "storage-engine",
    "database",
    "key-value",
    "rust"
]
categories = [
    "database-implementations",
    "data-structures"
]

include = [
    "src/**",
    "benches/**",
    "../../README.md",
    "../../LICENSE",
    "Cargo.toml",
]

[dependencies]
crc32c.workspace = true
thiserror.workspace = true
zstd = "0.14.3"
spillsort = "0.2.0"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
xorf = { version = "0.13.0", features = ["serde"] }
lz4_flex = "0.14.0"
bytes = "1.12.1"
quick_cache = "0.7.0"
memmap2 = "0.9.12"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
rand.workspace = true

[[bench]]
name = "lookup"
harness = false

[[bench]]
name = "multithreaded_lookup"
harness = false

[[bench]]
name = "scan"
harness = false

[[bench]]
name = "api"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "workloads"
harness = false
